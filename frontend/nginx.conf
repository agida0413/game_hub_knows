# 화면(정적 파일) 전용 nginx
# API 라우팅·로드밸런싱은 앞단 gateway(docker/gateway) 가 담당 → 여기는 React 빌드 결과만 제공한다.
# 요청 ID 는 gateway 가 붙여서 보내준 값을 그대로 로그에 남긴다.

map $status $log_level {
    ~^5     ERROR;
    ~^4     WARNING;
    default INFO;
}

log_format app '$time_iso8601 | $log_level | rid=$http_x_request_id | nginx | '
               'method=$request_method path=$uri status=$status ms=$request_time bytes=$body_bytes_sent '
               'client=$http_x_real_ip';

server {
    listen 80;
    access_log /dev/stdout app;
    # 없는 파일 요청(스캐너 봇의 /.env · /wp-admin 등)을 에러 로그로 남기지 않는다 — 404 응답은 그대로
    log_not_found off;

    # 숨김 파일(.env · .git …)은 존재 여부와 상관없이 404 (빌드 결과에는 원래 없음)
    location ~ /\. {
        access_log off;
        return 404;
    }

    # 폴더 목록 요청(/assets/)도 조용히 404
    location = /assets/ {
        access_log off;
        return 404;
    }

    # 빌드 산출물(파일명에 해시 포함)은 오래 캐시, 정적 파일 접속 로그는 생략
    location /assets/ {
        root /usr/share/nginx/html;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        gzip_static on;
        gzip_vary on;
    }

    # 막간 첫 화면의 홈 화면 앱 정보 (게임은 위 /g/<게임>/manifest.webmanifest)
    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
        access_log off;
        add_header Cache-Control "public, max-age=3600";
    }

    # 파비콘 · 홈 화면 아이콘 (자주 안 바뀜)
    location ~ ^/(favicon\.(svg|ico)|apple-touch-icon\.png)$ {
        root /usr/share/nginx/html;
        access_log off;
        add_header Cache-Control "public, max-age=86400";
    }

    # 시제품 · 실험 페이지 (public/lab/<이름>/ — 막간 화면과 별개, 정적 파일 그대로)
    #   폴더 주소(/lab/chueok/)는 그 폴더의 index.html, 슬래시 없는 주소는 상대 301, 없는 파일은 404 (화면 index.html 로 넘기지 않음)
    location /lab/ {
        root /usr/share/nginx/html;
        index index.html;
        absolute_redirect off;
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        add_header X-Robots-Tag "noindex, nofollow";
        # 사진 · 음악은 아직 없을 수 있다(화면이 직접 그린 자리 표시로 대신) — 없는 파일 확인 요청은 로그에 남기지 않는다
        location ~ \.(webp|mp3)$ {
            access_log off;
            log_not_found off;
            try_files $uri =404;
            add_header Cache-Control "no-cache";
        }
    }

    # 게임 공유 그림을 게임 폴더로 옮긴 것(public/<게임>/og.jpg, 2026-11-26) — 메신저가 기억해 둔 옛 미리보기 그림 주소도 열리게 (아래 사진 location 보다 먼저)
    location ~ "^/og/(room|future|search|knows|train|beat|judge)\.jpg$" {
        absolute_redirect off;   # 상대 주소로 넘긴다 (앞단 게이트웨이 뒤라 호스트 · 포트 · https 를 모른다)
        return 301 /$1/og.jpg;
    }
    # 최후의 변론 전용 자산을 public/judge/ 로 옮긴 것(2026-11-26) — 메신저 · 캐시 · 옛 화면이 기억한 옛 주소도 열리게
    location = /title-bg.jpg { absolute_redirect off; return 301 /judge/title-bg.jpg; }
    location = /og.jpg { absolute_redirect off; return 301 /judge/og-case.jpg; }
    location = /judge-icon.svg { absolute_redirect off; return 301 /judge/icon.svg; }
    location ~ "^/voice/([a-z_]+\.wav)$" { absolute_redirect off; return 301 /judge/voice/$1; }

    # 게임 주소 /g/<게임>[/…] (2026-11-26 허브 유지 + 게임 독립) — 빌드가 만든 그 게임 첫 화면(dist/g/<게임>/index.html: 게임 제목 · 미리보기 · 소개)
    #   주소창은 그대로('#' 없음). 게임 안 주소(/g/room/방id)도 같은 파일, 홈 화면 앱 정보는 manifest.webmanifest. 모르는 게임은 막간 첫 화면(화면 앱이 첫 화면으로)
    location ~ "^/g/([a-z0-9]{1,16})(/.*)?$" {
        root /usr/share/nginx/html;
        try_files $uri /g/$1/index.html /index.html;
        gzip_static on;
        gzip_vary on;
        add_header Cache-Control "no-cache";
        location ~ \.webmanifest$ {
            default_type application/manifest+json;
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600";
        }
    }

    # 게임 사진 · 음악 (public/<게임>/…) — 파일 이름이 안 바뀌므로 해시 파일보다 짧게(1일) 캐시, 갱신 중에는 옛것을 보여 주며 새로 받음
    #   없는 파일은 지금처럼 화면 index.html 로 (try_files 그대로). 같은 이름으로 파일을 바꾸면 최대 하루 늦게 반영 → 바꿀 때는 파일 이름도 바꾼다
    #   Range(mp3 이어 듣기)는 nginx 정적 처리가 그대로 206 으로 응답
    location ~* ^/(beat|future|knows|room|search|train|judge|rules|tim|edge|voice|og)/.+\.(webp|jpg|png|mp3)$ {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    # index.html 은 매번 확인 → 재배포 후 새로고침만 해도 새 화면 코드를 받음
    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        gzip_static on;
        gzip_vary on;
        add_header Cache-Control "no-cache";
    }
}
